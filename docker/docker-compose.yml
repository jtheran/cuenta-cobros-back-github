version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_prisma
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lsvDB
      MYSQL_USER: prisma
      MYSQL_PASSWORD: prismapass
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
