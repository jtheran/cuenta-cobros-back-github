version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_prisma
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: prisma
      MYSQL_PASSWORD: prismapass
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
